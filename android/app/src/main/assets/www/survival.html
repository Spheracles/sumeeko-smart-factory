<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SUMEEKO：AI 工程師生存戰｜主線第十二章</title>



<style>
/* 版面概念：智慧製造指揮中心 — 藍圖網格上的九宮格控制臺，主工作區最大，左側工具、右側通訊與指標 */
:root{
  --bg:#06101d; --bg2:#091728; --panel:#0c1d33; --panel2:#10284a; --sunk:#071324;
  --line:#1b3657; --line2:#285079;
  --fg:#e6eef8; --fg2:#a9bdd5; --fg3:#7189a8;
  --cyan:#38cde6; --cyan2:#1f9fbb; --cyanbg:rgba(56,205,230,.10);
  --steel:#b8c4d1; --gold:#f2a541; --goldbg:rgba(242,165,65,.12);
  --green:#46d08a; --greenbg:rgba(70,208,138,.12);
  --red:#ff6262; --redbg:rgba(255,98,98,.12);
  --violet:#a68cff; --violetbg:rgba(166,140,255,.13);
  --font-d:"Chakra Petch","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-b:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px; --r-s:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-b);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 24px;
  background:
    radial-gradient(1200px 600px at 70% -10%,rgba(56,205,230,.10),transparent 60%),
    radial-gradient(900px 500px at -10% 110%,rgba(166,140,255,.07),transparent 60%),
    linear-gradient(var(--bg),var(--bg));
  background-attachment:fixed;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(56,205,230,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(56,205,230,.045) 1px,transparent 1px);
  background-size:32px 32px;}
#app{position:relative;z-index:1;max-width:1500px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--font-d);text-wrap:balance;margin:0;line-height:1.25;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
.num{font-family:var(--font-d);font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-m)}
.lbl{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);font-family:var(--font-d);font-weight:600}
.muted{color:var(--fg2)}
.dim{color:var(--fg3)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--fg2);white-space:nowrap}
.tag.ai{border-color:rgba(166,140,255,.5);color:var(--violet);background:var(--violetbg)}
.tag.ok{border-color:rgba(70,208,138,.45);color:var(--green);background:var(--greenbg)}
.tag.warn{border-color:rgba(242,165,65,.5);color:var(--gold);background:var(--goldbg)}
.tag.bad{border-color:rgba(255,98,98,.5);color:var(--red);background:var(--redbg)}
.tag.info{border-color:rgba(56,205,230,.45);color:var(--cyan);background:var(--cyanbg)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:var(--r-s);
  border:1px solid var(--line2);background:var(--panel2);color:var(--fg);cursor:pointer;font-weight:500;transition:border-color .15s,background .15s,transform .1s;text-align:center}
.btn:hover{border-color:var(--cyan2);background:#143259}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#f6b45a,#e2902a);color:#1b1206;border-color:#f6b45a;font-weight:700}
.btn.pri:hover{background:linear-gradient(180deg,#ffc271,#ec9a34)}
.btn.cy{background:var(--cyanbg);border-color:rgba(56,205,230,.6);color:var(--cyan)}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:4px 11px;font-size:13px}
.btn.danger{border-color:rgba(255,98,98,.55);color:var(--red);background:var(--redbg)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-s);overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;border:0;border-right:1px solid var(--line);padding:5px 10px;font-size:13px;cursor:pointer;color:var(--fg2);min-height:32px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--cyanbg);color:var(--cyan);font-weight:700}
.seg.g button[aria-pressed="true"]{background:var(--goldbg);color:var(--gold)}
.seg button.v-ok[aria-pressed="true"]{background:var(--greenbg);color:var(--green)}
.seg button.v-warn[aria-pressed="true"]{background:var(--goldbg);color:var(--gold)}
.seg button.v-bad[aria-pressed="true"]{background:var(--redbg);color:var(--red)}
.seg button.v-ai[aria-pressed="true"]{background:var(--violetbg);color:var(--violet)}

.panel{background:linear-gradient(180deg,rgba(16,40,74,.72),rgba(12,29,51,.82));border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel>.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-s);padding:12px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.scrollx{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--fg3);font-weight:600;font-size:12px;letter-spacing:.06em;white-space:nowrap}
td.r,th.r{text-align:right}

/* ====== start screen ====== */
.start{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;padding-block:28px 12px;align-items:start}
@media (max-width:980px){.start{grid-template-columns:minmax(0,1fr)}}
.brandline{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brandline .mark{width:34px;height:34px}
.kicker{font-family:var(--font-d);color:var(--cyan);letter-spacing:.22em;font-size:12.5px;font-weight:600}
.title-zh{font-family:var(--font-b);font-weight:900;font-size:clamp(34px,5.4vw,64px);line-height:1.08;letter-spacing:.02em;margin-top:6px}
.title-zh em{font-style:normal;color:var(--gold)}
.title-en{font-family:var(--font-d);font-size:clamp(15px,1.7vw,20px);color:var(--fg2);letter-spacing:.08em;margin-top:8px}
.narr{margin-top:22px;border-left:2px solid var(--cyan2);padding-left:16px;max-width:62ch;display:flex;flex-direction:column;gap:9px;color:var(--fg2)}
.narr p{animation:rise .7s both}
.narr p.hl{color:var(--fg);font-weight:500}
@keyframes rise{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.cta .btn.pri{font-size:17px;min-height:50px;padding:10px 26px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
@media (max-width:520px){.modes{grid-template-columns:minmax(0,1fr)}}
.mode{text-align:left;cursor:pointer;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px;display:flex;flex-direction:column;gap:3px}
.mode:hover{border-color:var(--cyan2)}
.mode b{font-family:var(--font-d);font-size:15px}
.mode span{font-size:13px;color:var(--fg2)}
.setup{display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:16px;align-items:flex-end}
.setup label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--fg3)}
input[type=text],input[type=search],select{background:var(--sunk);color:var(--fg);border:1px solid var(--line2);border-radius:var(--r-s);padding:7px 10px;font:inherit;min-height:36px;max-width:100%}
.disclaimer{margin-top:20px;font-size:12.5px;color:var(--fg3);border:1px dashed var(--line2);border-radius:var(--r-s);padding:10px 12px;max-width:72ch}
.hero-art{position:relative;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,#0a1b31,#071324);overflow:hidden;min-width:0}
.hero-art svg{display:block;width:100%;height:auto}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.belt-item{animation:belt 7s linear infinite}
@keyframes belt{from{transform:translateX(-80px)}to{transform:translateX(560px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.flowline{stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.sub-panel{margin-top:16px}

/* ====== game layout (九宮格) ====== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:248px minmax(0,1fr) 300px;gap:14px;align-items:center;
  padding-block:10px;background:linear-gradient(180deg,rgba(6,16,29,.97),rgba(6,16,29,.9));border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px;backdrop-filter:blur(6px)}
.top .brand{display:flex;align-items:center;gap:9px;min-width:0}
.top .brand .mark{width:28px;height:28px;flex:none}
.top .brand b{font-family:var(--font-d);font-size:14px;letter-spacing:.08em;display:block;line-height:1.1}
.top .brand small{font-size:11px;color:var(--fg3);display:block}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lvtitle{min-width:0}
.lvtitle .lbl{color:var(--cyan)}
.lvtitle h1{font-size:clamp(17px,2vw,23px);font-family:var(--font-b);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvtitle .en{font-family:var(--font-d);color:var(--fg3);font-size:12.5px;letter-spacing:.06em}
.status{display:flex;flex-direction:column;gap:6px}
.status .r1{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--fg2)}
.status .r1 b{color:var(--fg);font-family:var(--font-d);font-size:15px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:6px;border-radius:2px;background:var(--line)}
.dots i.done{background:var(--cyan2)}
.dots i.cur{background:var(--gold)}
.flowbar{height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:scan 3.5s linear infinite;margin-inline:-16px;opacity:.6}
@keyframes scan{from{background-position:-40% 0}to{background-position:140% 0}}

.console{display:grid;grid-template-columns:248px minmax(0,1fr) 300px;gap:14px;margin-top:14px;align-items:start}
.colL,.colR{position:sticky;top:96px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 110px);overflow:auto;scrollbar-width:thin;min-width:0}
.colM{min-width:0;display:flex;flex-direction:column;gap:14px}
.work{min-height:420px}
.actions{position:sticky;bottom:0;z-index:10;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:rgba(7,19,36,.96);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(6px)}
.actions .hint-txt{font-size:13px;color:var(--fg3);min-width:0;flex:1 1 220px}
.actions .grp{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:1180px){
  .top{grid-template-columns:200px minmax(0,1fr) 260px}
  .console{grid-template-columns:210px minmax(0,1fr) 260px}
}
.mstrip{display:none}
@media (max-width:980px){
  .top{position:static;grid-template-columns:minmax(0,1fr);gap:8px}
  .top .brand{align-items:flex-start}
  .nav{flex-wrap:nowrap;overflow-x:auto}
  .nav .btn{flex:none}
  .mstrip{display:flex;flex-wrap:wrap;gap:4px 12px;width:100%;font-size:12px;color:var(--fg2);border-bottom:1px solid var(--line);padding-bottom:6px}
  .mstrip b{font-family:var(--font-d);color:var(--fg);font-variant-numeric:tabular-nums}
  .console{grid-template-columns:minmax(0,1fr)}
  .colL,.colR{position:static;max-height:none;overflow:visible}
  .colM{order:1}.colR{order:2}.colL{order:3}
}
@media (max-width:520px){ body{font-size:14.5px}}

/* side panels */
.toolsec{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.gl dt{font-weight:700;font-size:13.5px}
.gl dt span{font-family:var(--font-d);color:var(--violet);font-weight:500;font-size:12px;margin-left:6px}
.gl dd{margin:0 0 8px;font-size:13px;color:var(--fg2)}
.loglist{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.loglist .li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.loglist .li .k{font-family:var(--font-d);color:var(--fg3);font-size:11px;padding-top:2px}
.msg{display:grid;grid-template-columns:34px minmax(0,1fr);gap:9px;align-items:start}
.msg .who{font-size:12px;color:var(--fg3)}
.msg .who b{color:var(--fg2);font-weight:700;margin-right:6px}
.msg .bubble{background:var(--sunk);border:1px solid var(--line);border-radius:4px 10px 10px 10px;padding:7px 10px;font-size:13.5px}
.msgs{display:flex;flex-direction:column;gap:10px}
.av{width:34px;height:34px;display:block}
.met{display:flex;flex-direction:column;gap:9px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:baseline}
.mrow .mn{font-size:12.5px;color:var(--fg2)}
.mrow .mv{font-family:var(--font-d);font-size:16px;font-variant-numeric:tabular-nums;font-weight:600}
.mrow .mv small{font-size:11px;color:var(--fg3);font-weight:500;margin-left:4px}
.mrow .bar{grid-column:1/-1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;position:relative}
.mrow .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--cyan);transition:width .6s ease}
.mrow .st{grid-column:1/-1;font-size:11px;color:var(--fg3);display:flex;justify-content:space-between}
.flash-up{animation:fup 1.2s}.flash-dn{animation:fdn 1.2s}
@keyframes fup{0%{color:var(--green);text-shadow:0 0 12px var(--green)}100%{}}
@keyframes fdn{0%{color:var(--red);text-shadow:0 0 12px var(--red)}100%{}}
.budget .bar{height:10px}
.budget .bar i.sp{background:linear-gradient(90deg,var(--cyan2),var(--cyan))}
.budget .bar .res{position:absolute;top:0;bottom:0;border-left:2px dashed var(--gold)}
.risklist{display:flex;flex-direction:column;gap:8px;font-size:13px}
.riskitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px}
.riskitem .p{font-family:var(--font-d);font-variant-numeric:tabular-nums}
.meter{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold)}

/* main workspace components */
.eyebrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.story{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:600px){.story{grid-template-columns:minmax(0,1fr)}.story .lvicon{width:72px}}
.lvicon{width:120px;height:auto;color:var(--cyan)}
.story p{max-width:68ch;margin-bottom:8px}
.dialog{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.dialog .msg .bubble{font-size:14.5px}
.hintbox{border:1px solid rgba(166,140,255,.45);background:var(--violetbg);border-radius:var(--r-s);padding:10px 12px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;font-size:14px}
.hintbox b{color:var(--violet)}
.sectitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sectitle h2{font-size:20px;font-family:var(--font-b);font-weight:900}
.desc{color:var(--fg2);font-size:14px;max-width:72ch}

/* sort task */
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:860px){.bins{grid-template-columns:minmax(0,1fr)}}
.bin{border:1px dashed var(--line2);border-radius:var(--r-s);padding:8px;min-height:120px;display:flex;flex-direction:column;gap:7px;background:rgba(7,19,36,.6)}
.bin.over{border-color:var(--cyan);background:var(--cyanbg)}
.bin h4{font-size:13px;display:flex;justify-content:space-between;color:var(--fg2)}
.req{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-s);padding:8px 9px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.req .t{font-size:13.5px}
.req .src{font-size:11.5px;color:var(--fg3);display:flex;align-items:center;gap:5px}
.req.ok{border-color:rgba(70,208,138,.6)}.req.no{border-color:rgba(255,98,98,.6)}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:12px}

/* code task */
.ide{background:#050d19;border:1px solid var(--line2);border-radius:var(--r-s);overflow:hidden}
.ide .tab{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-family:var(--font-m);font-size:12px;color:var(--fg2);background:#0a1628}
.ide .tab i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block}
.code{font-family:var(--font-m);font-size:12.8px;line-height:1.75;overflow-x:auto}
.cl{display:grid;grid-template-columns:44px max-content;min-width:100%;cursor:pointer;border-left:3px solid transparent}
.cl:hover{background:rgba(56,205,230,.06)}
.cl .n{color:#4b6588;text-align:right;padding-right:12px;user-select:none}
.cl .c{white-space:pre;padding-right:16px;color:#cdd9e8}
.cl.mk{background:rgba(242,165,65,.12);border-left-color:var(--gold)}
.cl.res-ok{background:rgba(70,208,138,.12);border-left-color:var(--green)}
.cl.res-miss{background:rgba(255,98,98,.12);border-left-color:var(--red)}
.cl.res-fp{background:rgba(166,140,255,.12);border-left-color:var(--violet)}
.tk-kw{color:#c792ea}.tk-str{color:#c3e88d}.tk-dec{color:#f2a541}.tk-fn{color:#82aaff}.tk-cm{color:#5f7a99}.tk-num{color:#f78c6c}
.fixcard{border:1px solid rgba(242,165,65,.45);border-radius:var(--r-s);padding:10px;display:flex;flex-direction:column;gap:7px;background:rgba(242,165,65,.05)}
.radio{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.radio input{margin-top:5px;accent-color:var(--gold)}
.order{display:flex;flex-direction:column;gap:6px}
.order .it{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 9px;border:1px solid var(--line2);border-radius:var(--r-s);background:var(--panel2);font-size:13.5px}
.order .it b{font-family:var(--font-d);color:var(--gold);min-width:20px}

/* OCR drawing */
.drawing{background:#eef3f8;border-radius:var(--r-s);border:1px solid var(--line2);overflow:hidden}
.drawing svg{display:block;width:100%;height:auto}
.ocrrow td{vertical-align:middle}
.ocrrow.hl{background:var(--violetbg)}
.conf{display:flex;align-items:center;gap:6px;font-family:var(--font-d);font-size:12.5px}
.conf i{display:block;width:44px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;position:relative}
.conf i b{position:absolute;inset:0 auto 0 0;background:var(--violet)}

/* flow (erp) */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:6px}
.fnode{flex:1 0 128px;min-width:128px;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-s);padding:8px;display:flex;flex-direction:column;gap:5px}

  const m = S.m, sev2 = S.inc.filter(i => i.sev === 2);

  const reasons = [];
  if (m.spent > BUDGET * 1.2) reasons.push(`總支出 ${NT(m.spent)}，超過核定預算 ${NT(BUDGET)} 達 20% 以上`);
  if (m.days > DEADLINE + 25) reasons.push(`工期 ${m.days} 日，超過期限 25 日以上`);
  if (m.sec < 40) reasons.push(`資訊安全成熟度 ${m.sec}，低於可接受水準 40`);
  if (m.quality < 50) reasons.push(`系統品質指數 ${m.quality}，低於可接受水準 50`);

  if (m.spent > BUDGET * 1.08) reasons.push(`總支出 ${NT(m.spent)}，超過核定預算 8% 以上`);
  if (m.days > DEADLINE + 20) reasons.push(`工期 ${m.days} 日，超過期限 20 日以上`);
  if (reasons.length) return { k: 'E', reasons };
  const sev1p = S.inc.filter(i => i.sev >= 1).length;
  if (m.spent <= BUDGET && m.days <= DEADLINE + 5 && m.quality >= 72 && m.brand >= 72 && m.cust >= 72 && sev2.length === 0)
    return { k: 'A', reasons: [`支出 ${NT(m.spent)}（核定 ${NT(BUDGET)} 內）`, `工期 ${m.days} 日`, `品質 ${m.quality}、品牌 ${m.brand}、客戶 ${m.cust}`] };
  if (m.days <= DEADLINE && (sev1p >= 3 || m.quality < 65 || sev2.length >= 1))
    return { k: 'C', reasons: [`工期 ${m.days} 日，如期或提前`, `中度以上事故 ${sev1p} 起，其中重大 ${sev2.length} 起`, `系統品質 ${m.quality}`] };
  const rs = [];
  if (m.spent > BUDGET) rs.push(`超出核定預算 ${NT(m.spent - BUDGET)}`);
  else if (m.spent > BUDGET - RESERVE) rs.push(`動用預備金 ${NT(m.spent - (BUDGET - RESERVE))}`);
  if (m.days > DEADLINE) rs.push(`工期超出 ${Math.round(m.days - DEADLINE)} 日`);
  if (sev2.length) rs.push(`重大事故 ${sev2.length} 起，應變效能 ${r100(avgResp)}%`);
  if (m.quality < 72 || m.cust < 72 || m.brand < 72) rs.push(`品質 ${m.quality}、品牌 ${m.brand}、客戶 ${m.cust}`);

}

function hlPy(line) {
  const re = /(#.*$)|(f?"(?:[^"\\]|\\.)*"|f?'(?:[^'\\]|\\.)*')|(@[\w.]+)|\b(def|return|import|from|if|else|None|True|False|in|and|or|not|methods)\b|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]\w*(?=\())/g;
  let out = '', last = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index));
    const cls = m[1] ? 'cm' : m[2] ? 'str' : m[3] ? 'dec' : m[4] ? 'kw' : m[5] ? 'num' : 'fn';
    out += `<span class="tk-${cls}">${esc(m[0])}</span>`; last = re.lastIndex;

  return out + esc(line.slice(last));
}

    return `<div class="fnode"><h5>${esc(n)}</h5>${cs.map(c => `<span class="fbadge ${t.on[c.k] ? '' : 'off'}">${esc(c.t.split(' ')[0])}</span>`).join('')}${extra.map(x => `<span class="fbadge ${x.on ? '' : 'off'}">${esc(x.t)}</span>`).join('')}</div>${i < T.nodes.length - 1 ? `<div class="farrow">${IC.arrow}</div>` : ''}`;

function vGpu(L, t, res) {
  const sim = gpuSim(t, S.f), last = t.last;
  const memPct = Math.min(sim.memPct, 1.25);
  const gpuCard = (i) => {
    const active = i === 0 || t.rep > 1;
    const used = i === 0 ? sim.mem0 : sim.weights + sim.kv + 2;
    const p = active ? Math.min(used / GPU_MEM, 1.0) : 0;
    return `<div class="gpu"><div class="row" style="justify-content:space-between"><b class="num">gpu-${i}</b><span class="dim num" style="font-size:12px">${active ? (used).toFixed(1) + ' / 48 GB' : '閒置'}</span></div>
      <div class="vram"><i class="${used / GPU_MEM > 0.9 && active ? 'over' : ''}" style="height:${p * 100}%"></i><span class="lim" style="bottom:90%"></span></div>
      <div class="dim" style="font-size:11.5px;margin-top:4px">${i === 0 ? '含 Whisper 語音轉寫 6 GB' : (active ? '推論副本 2' : '提高副本數即可啟用')}</div></div>`;
  };
  const term = last ? [
    `$ docker compose up llm-serve --scale replicas=${last.cfg.rep}`,
    `[cuda] driver 550 / image cuda 12.1  ${last.cfg.cudaPin ? 'pinned ✓' : 'NOT pinned (warn)'}`,
    `[load] model=${last.cfg.size}B ${last.cfg.quant}  weights=${last.sim.weights.toFixed(1)}GB  kv=${last.sim.kv.toFixed(1)}GB`,
    last.sim.memPct > 1 ? `[ERROR] torch.cuda.OutOfMemoryError (need ${last.sim.mem0.toFixed(1)}GB > 48GB)` : `[ok] gpu-0 mem ${pct(last.sim.memPct)}`,
    `$ loadtest --rpm ${last.sim.demand} --duration 10m`,
    `throughput=${Math.round(last.sim.thr)} req/min  util=${pct(last.sim.util)}`,
    `p95=${last.sim.p95.toFixed(1)}s  errors=${last.sim.err.toFixed(1)}%  quality=${last.sim.quality}`,
    last.sim.pass ? 'RESULT: PASS' : 'RESULT: FAIL'
  ].join('\n') : '$ 尚未執行壓力測試。調整左側設定後按下「執行壓力測試」。';
  const changed = last && JSON.stringify(last.cfg) !== JSON.stringify(cfgOf(t));
  const seg = (act, vals, cur, lab) => `<div class="seg" role="group" aria-label="${lab}">${vals.map(v => `<button data-act="${act}" data-v="${v[0]}" aria-pressed="${String(cur) === String(v[0])}" ${ro(res)}>${v[1]}</button>`).join('')}</div>`;
  return `<div class="console-ui">
    <div class="ctlgrid">
      <label>模型規模 ${seg('gpuSize', [[7, '7B'], [14, '14B'], [32, '32B'], [70, '70B']], t.size, '模型規模')}</label>

function radar(sc) {
  const cx = 170, cy = 150, R = 105, n = SKILLS.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const ring = f => SKILLS.map((_, i) => pt(i, R * f).join(',')).join(' ');
  const poly = SKILLS.map(([k], i) => pt(i, R * sc[k] / 100).join(',')).join(' ');
  return `<svg class="radar" viewBox="0 0 340 300" role="img" aria-label="五項工程能力雷達圖">
    ${[0.25, 0.5, 0.75, 1].map(f => `<polygon points="${ring(f)}" fill="none" stroke="#1b3657"/>`).join('')}
    ${SKILLS.map((_, i) => `<line x1="${cx}" y1="${cy}" x2="${pt(i, R)[0]}" y2="${pt(i, R)[1]}" stroke="#1b3657"/>`).join('')}
    <polygon points="${poly}" fill="rgba(56,205,230,.22)" stroke="#38cde6" stroke-width="2"/>
    ${SKILLS.map(([k], i) => { const p = pt(i, R * sc[k] / 100); return `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#f2a541"/>`; }).join('')}
    ${SKILLS.map(([k, n2], i) => { const p = pt(i, R + 22); return `<text x="${p[0]}" y="${p[1] + 4}" text-anchor="middle">${n2} ${sc[k]}</text>`; }).join('')}
  </svg>`;
}

function currentHint() {

function toast(t) { let w = $('#toasts'); if (!w) { w = document.createElement('div'); w.id = 'toasts'; w.className = 'toasts'; w.setAttribute('aria-live', 'polite'); document.body.appendChild(w); } const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; w.appendChild(d); setTimeout(() => d.remove(), 3600); }
function startGame(o) {
  S = newState({ mode: o.mode || 'career', seed: UI.start.seed || 'SMK-2026', diff: UI.start.diff, mentor: o.mentor, li: o.li || 0, flags: o.flags, chal: o.chal ?? null, drill: o.drill ?? null });

}
function recordRun() {
  if (S.mode !== 'career' || S.ending.saved) return;

  runs.push({ id: S.runId, at: Date.now(), seed: S.seed, diff: DIFF[S.diff].n, end: S.ending.k, spent: S.m.spent, loss: S.cost.loss, brand: S.m.brand, cust: S.m.cust, ocr: ({ none: 'A 直接採用', cross: 'B 交叉驗證', hold: 'C 暫緩', tiered: 'D 分級覆核' })[S.f.ocrCtl] || '—', launch: S.f.launch || '—' });
  store.set(KEYS.runs, runs.slice(-20)); S.ending.saved = true;
}
function recordChal() {
  const all = store.get(KEYS.chal) || [];
  const st = S.stage; const logs = S.log.slice(st.logStart);
  all.push({ lv: S.li + 1, at: Date.now(), seed: S.seed, choices: logs.filter(e => e.kind === 'decision').map(e => e.choice), task: S.taskRes ? Math.round(S.taskRes.score * 100) : 0,
    spent: S.m.spent - st.startM.spent, prev: logs.reduce((a, e) => a + e.costs.filter(c => c.cat === 'prev').reduce((b, c) => b + c.amt, 0), 0),
    loss: logs.reduce((a, e) => a + e.costs.filter(c => c.cat === 'loss' || c.cat === 'rec').reduce((b, c) => b + c.amt, 0), 0), days: Math.round((S.m.days - st.startM.days) * 10) / 10,
    inc: S.inc.slice(st.incStart).map(i => SEVN[i.sev]).join('、') || '無', el: st.elEnd });
  store.set(KEYS.chal, all.slice(-60));
  return all.filter(h => h.lv === S.li + 1).slice(-8);
}

const A = {
  startCareer() { startGame({ mode: 'career', mentor: false }); },
  startGuided() { startGame({ mode: 'career', mentor: true }); },
  openPanel(el) { UI.panel = el.dataset.v || null; },
  startChal(el) { const li = +el.dataset.v; startGame({ mode: 'challenge', li, flags: li > 0 ? NEUTRAL : {}, chal: li }); },
  startDrill(el) {

    startGame({ mode: 'drill', li, flags: NEUTRAL, drill: id });
    S.seed = prevSeed + '-drill';
    const d = incDef(id), dl = DIFF[S.diff].l;
    const items = d.loss[dr.sev].map(([l, v]) => [l, Math.round(v * dl / 1000) * 1000]);
    applyIncident(S, { id, occurred: true, p: 1, sev: dr.sev, items, total: items.reduce((a, x) => a + x[1], 0) }, li + 1);
    S.queue = [0]; S.phase = 'incident'; S.resp = { plan: [], done: false };
  },
  continue() { const a = getAuto(); if (a) { S = a; UI.screen = S.phase === 'ending' ? 'game' : 'game'; UI.lastM = null; } },
  loadSave() { const s = getSave(); if (!s) { toast('沒有手動存檔。'); return; } S = s.S; UI.screen = 'game'; UI.lastM = null; toast('已讀取存檔（' + new Date(s.at).toLocaleString('zh-TW') + '）。'); },
  save() { manualSave(); },
  setStartDiff(el) { UI.start.diff = el.dataset.v; savePrefs(); },
  setReduce(el) { UI.reduce = el.dataset.v === '1'; savePrefs(); if (UI.modal) modalSettings(); },
  menu() { openModal(`<h2>返回主選單？</h2><p class="muted">${S.mode === 'career' ? '目前進度已自動儲存，可從主選單「繼續上次進度」。' : '挑戰／演練模式的進度不會保留。'}</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-act="closeModal">取消</button><button class="btn pri" data-act="menuNow">返回主選單</button></div>`); return 'noRender'; },
  menuNow() { closeModal(); UI.screen = 'start'; UI.panel = null; S = null; },
  openLog() { modalLog(); return 'noRender'; },
  settings() { modalSettings(); return 'noRender'; },
  closeModal() { closeModal(); },
  hint() { openModal(`<h2>工程師導師提示</h2>${hintBox(currentHint())}<p class="dim" style="margin-top:10px;font-size:13px">導師不直接給答案，只提醒可疑資訊、缺少的驗證與被忽略的風險。</p><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" data-act="closeModal">了解</button></div>`); return 'noRender'; },
  toggleMentor() { S.mentor = !S.mentor; },
  setMentor(el) { S.mentor = el.dataset.v === '1'; modalSettings(); },
  setDiff(el) { const v = el.dataset.v; if (v !== S.diff) { S.diff = v; applyEff(S, { why: `難度切換為「${DIFF[v].n}」：${DIFF[v].d}` }, { kind: 'setting', title: '難度切換', choice: DIFF[v].n }); } modalSettings(); },
  askRestart() { openModal(`<h2>重新開始遊戲？</h2><p class="muted">目前職涯的自動存檔會被清除（手動存檔保留）。</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-act="closeModal">取消</button><button class="btn danger" data-act="restartNow">重新開始</button></div>`); return 'noRender'; },
  restartNow() { closeModal(); store.del(KEYS.auto); MEM.auto = null; const mode = S.mode; const mentor = S.mentor; startGame({ mode: mode === 'career' ? 'career' : 'career', mentor }); },
  newGame() { store.del(KEYS.auto); MEM.auto = null; UI.screen = 'start'; S = null; },
  replaySeed() { const seed = S.seed, diff = S.diff, mentor = S.mentor; UI.start.seed = seed; UI.start.diff = diff; store.del(KEYS.auto); startGame({ mode: 'career', mentor }); toast(`以相同種子 ${seed} 重新挑戰。`); },

  beginTask() { beginLevel(S); },
  resetTask() { S.task = TASK[curL(S).task.type].init(curL(S), S); UI.hl = null; },
  submitTask() { const L = curL(S); if (!TASK[L.task.type].ready(S.task, L)) return; submitTask(S); },
  toDecision() { S.phase = 'd0'; S.sel = null; },
  selOpt(el) { S.sel = el.dataset.v; },
  confirmDec() { if (!S.sel) return; confirmDecision(S, +S.phase[1], S.sel); },

  respAdd(el) { const k = el.dataset.v; if (!S.resp.plan.includes(k) && S.resp.plan.length < 6) S.resp.plan.push(k); },
  respRm(el) { S.resp.plan = S.resp.plan.filter(k => k !== el.dataset.v); },
  respClear() { S.resp.plan = []; },

  afterResp() { if (S.mode === 'drill') { S.phase = 'drillend'; return; } afterResponse(S); },
  nextLevel() { unlockUpTo(S.li + 1); nextLevel(S); },
  retryLevel() { const prev = retryLevel(S); S = prev; UI.lastM = null; toast('已還原到本關開始前的狀態。'); },
  toEnding() { unlockUpTo(8); endGame(S); recordRun(); },
  endChal() {
    const hist = recordChal(); const lv = S.li + 1;
    openModal(`<h2>第 ${lv} 關 挑戰比較</h2><p class="dim" style="margin-bottom:10px">每次挑戰都以相同起始條件開始。以下是你在本瀏覽器的最近紀錄（最新在下）。</p><div class="scrollx"><table><thead><tr><th>決策</th><th class="r">任務</th><th class="r">預防投入</th><th class="r">事故＋復原</th><th class="r">本關總支出</th><th class="r">工期</th><th>事故</th></tr></thead><tbody>${hist.map(h => `<tr><td style="font-size:12.5px">${h.choices.map(esc).join('<br>')}</td><td class="r num">${h.task}%</td><td class="r num">${NT(h.prev)}</td><td class="r num">${NT(h.loss)}</td><td class="r num">${NT(h.spent)}</td><td class="r num">${h.days}</td><td>${esc(h.inc)}</td></tr>`).join('')}</tbody></table></div><p class="dim" style="font-size:12.5px;margin-top:8px">相同種子下，同樣的決策會得到同樣的結果；較好的控制只會降低事故機率，不會讓原本不會發生的事故發生。</p><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-act="chalAgain" data-v="${S.li}">再挑戰一次</button><button class="btn pri" data-act="menuNow">返回主選單</button></div>`);
    return 'noRender';
  },
  chalAgain(el) { closeModal(); A.startChal(el); },

  /* 任務互動 */
  sortPlace(el) { S.task.place[el.dataset.id] = el.dataset.v; },
  codeLine(el) { const i = +el.dataset.v, t = S.task; if (t.marked.includes(i)) { t.marked = t.marked.filter(x => x !== i); delete t.cat[i]; delete t.fix[i]; } else t.marked.push(i); },
  codeCat(el) { const i = +el.dataset.v; S.task.cat[i] = el.value || null; delete S.task.fix[i]; if (!el.value) delete S.task.cat[i]; },
  codeFix(el) { S.task.fix[+el.dataset.v] = +el.dataset.k; },
  orderAdd(el) { S.task.order.push(el.dataset.v); },
  orderRm(el) { S.task.order = S.task.order.filter(x => x !== el.dataset.v); },
  ocrAct(el) { S.task.act[el.dataset.id] = el.dataset.v; UI.hl = el.dataset.id; },
  ocrVal(el) { S.task.val[el.dataset.id] = el.value; },
  erpCtl(el) { S.task.on[el.dataset.v] = el.checked; },
  erpRetry(el) { S.task.retry = el.dataset.v; },
  erpFlag(el) { const i = +el.dataset.v, t = S.task; t.flag = el.checked ? [...t.flag, i] : t.flag.filter(x => x !== i); },
  dataFlag(el) { const i = +el.dataset.v, t = S.task; t.flag = el.checked ? [...t.flag, i] : t.flag.filter(x => x !== i); },
  dataRule(el) { const k = el.dataset.v, t = S.task; t.rules = el.checked ? [...t.rules, k] : t.rules.filter(x => x !== k); },
  dataSort(el) { const k = el.dataset.v, t = S.task; if (t.sort === k) t.dir = -t.dir; else { t.sort = k; t.dir = 1; } },
  dataQ(el) { S.task.q = el.value; },
  ragTag(el) { S.task.tag[el.dataset.id] = el.dataset.v; },
  ragSent(el) { const v = el.dataset.v, t = S.task; t.mark = t.mark.includes(v) ? t.mark.filter(x => x !== v) : [...t.mark, v]; },
  agMode(el) { S.task.mode[el.dataset.id] = el.dataset.v; },
  agCap(el) { S.task.cap = +el.value; },
  gpuSize(el) { S.task.size = +el.dataset.v; }, gpuQuant(el) { S.task.quant = el.dataset.v; }, gpuRep(el) { S.task.rep = +el.dataset.v; },
  gpuConc(el) { S.task.conc = +el.value; }, gpuTo(el) { S.task.timeout = +el.value; }, gpuQueue(el) { S.task.queue = +el.value; },
  gpuPin(el) { S.task.cudaPin = el.checked; }, gpuFb(el) { S.task.fallback = el.checked; },
  gpuTest() { const t = S.task; t.tested = true; t.last = { cfg: cfgOf(t), sim: gpuSim(t, S.f) }; },
  lnCls(el) { S.task.cls[el.dataset.id] = el.dataset.v; },
  lnChk(el) { const k = el.dataset.v, t = S.task; t.chk = el.checked ? [...t.chk, k] : t.chk.filter(x => x !== k); },
  seedIn(el) { UI.start.seed = el.value.trim().slice(0, 24) || 'SMK-2026'; return 'noRender'; }
};

function phaseKey() { return S ? `${UI.screen}|${S.li}|${S.phase}|${S.cons}|${S.resp && S.resp.done}` : UI.screen; }
function render() {
  document.body.classList.toggle('reduce', UI.reduce);
  const app = $('#app');
  const act = document.activeElement; const fk = act && act.id ? '#' + act.id : act && act.dataset && act.dataset.act ? `[data-act="${act.dataset.act}"]${act.dataset.v != null ? `[data-v="${act.dataset.v}"]` : ''}${act.dataset.id != null ? `[data-id="${act.dataset.id}"]` : ''}` : null;
  const caret = act && act.selectionStart != null && act.type === 'search' ? act.selectionStart : null;
  const key = phaseKey();
  if (!S || UI.screen === 'start') app.innerHTML = viewStart();
  else if (S.phase === 'ending') app.innerHTML = viewEnding();
  else app.innerHTML = viewGame();
  if (fk) { try { const n = app.querySelector(fk); if (n) { n.focus({ preventScroll: true }); if (caret != null && n.setSelectionRange) n.setSelectionRange(caret, caret); } } catch (e) { } }
  if (key !== UI.lastKey) { const w = $('#work'); if (w && UI.lastKey) { const top = w.getBoundingClientRect().top + window.scrollY - 110; if (window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: 'auto' }); } else if (!w) window.scrollTo({ top: 0 }); UI.lastKey = key; }
  if (S && S.m && UI.lastM) {
    ['brand', 'cust', 'quality', 'sec', 'risk', 'days', 'spent'].forEach(k => {
      const d = S.m[k] - UI.lastM[k]; if (!d) return;
      const good = (k === 'risk' || k === 'days' || k === 'spent') ? d < 0 : d > 0;
      app.querySelectorAll(`[data-m="${k}"]${k === 'spent' ? ',[data-m="spent2"]' : ''}`).forEach(n => n.classList.add(good ? 'flash-up' : 'flash-dn'));
    });
  }
  UI.lastM = S ? { ...S.m } : null;
  if (S) autosave();
}

function handle(el, ev) {
  const a = el.dataset.act; if (!A[a]) return;
  if (el.disabled) return;
  const r = A[a](el, ev);
  if (r !== 'noRender') render();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) { if (e.target.id === 'modal') closeModal(); return; }
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  handle(el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.type === 'range') { render(); return; }
  if ((el.tagName === 'INPUT' || el.tagName === 'SELECT') && el.type !== 'search' && el.type !== 'text') handle(el, e);
});
/* 拖曳滑桿時只更新數值（放開後才完整重繪，避免中斷拖曳） */
const RANGE_FMT = { agCap: v => NT(v), gpuTo: v => v + ' s', gpuConc: v => v, gpuQueue: v => v };
document.addEventListener('input', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.type === 'range') { const a = el.dataset.act; if (A[a]) { A[a](el); const lab = el.closest('label, .card'); const b = lab && lab.querySelector('.lv b, b.num'); if (b && RANGE_FMT[a]) b.textContent = RANGE_FMT[a](+el.value); } return; }
  if (el.type === 'search' || el.type === 'text') handle(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.modal) { closeModal(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act][tabindex]')) { e.preventDefault(); handle(e.target, e); }
});
document.addEventListener('mouseover', e => { const r = e.target.closest('[data-hl]'); if (r && UI.hl !== r.dataset.hl) { UI.hl = r.dataset.hl; const d = $('#ocr-draw'); if (d) d.innerHTML = ocrDrawing(UI.hl); document.querySelectorAll('.ocrrow').forEach(x => x.classList.toggle('hl', x.dataset.hl === UI.hl)); } });
/* 拖曳分類（第一關） */
document.addEventListener('dragstart', e => { const c = e.target.closest('[data-drag]'); if (c) { e.dataTransfer.setData('text/plain', c.dataset.drag); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragover', e => { const b = e.target.closest('[data-bin]'); if (b) { e.preventDefault(); b.classList.add('over'); } });
document.addEventListener('dragleave', e => { const b = e.target.closest('[data-bin]'); if (b) b.classList.remove('over'); });
document.addEventListener('drop', e => { const b = e.target.closest('[data-bin]'); if (!b || !S || !S.task || !S.task.place) return; e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); if (id in S.task.place) { S.task.place[id] = b.dataset.bin; render(); } });

/* 啟動（支援檢視器的熱更新快照） */
function boot(data) {
  if (data && data.S) { S = data.S; UI.screen = data.screen || 'game'; }
  render();
}
try { window.claude?.hot?.snapshot?.(() => ({ S, screen: UI.screen })); } catch (e) { }
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});

<script>
/* ===== 主線連動橋接：《從一顆螺絲到一座智慧工廠》第十二章 ===== */
(function () {
  var EMB = false; try { EMB = window.parent && window.parent !== window; } catch (e) { EMB = true; }
  if (!EMB) return;
  var PASS = ['A', 'B', 'D'];
  var INIT = null;
  function post(S) {
    if (!S || !S.ending || S.mode !== 'career') return;
    window.parent.postMessage({ type: 'smk-survival-end', ending: S.ending.k, reasons: S.ending.reasons || [], m: Object.assign({}, S.m), cost: Object.assign({}, S.cost),
      inc: S.inc.map(function (i) { return { name: i.name, sev: i.sev }; }), ach: (S.ach || []).slice(), diff: S.diff, mentor: !!S.mentor, runId: S.runId, sk: skillScores(S) }, '*');
  }
  var _eg = endGame;
  endGame = function (S) { _eg(S); try { post(S); } catch (e) { } };
  A.smkSend = function () { post(S); toast('已將結果回傳到主線遊戲。'); };
  A.smkBack = function () { window.parent.postMessage({ type: 'smk-survival-close' }, '*'); return 'noRender'; };
  var _vs = viewStart;
  viewStart = function () {
    var who = INIT && INIT.name ? esc(INIT.name) + '，' : '';
    return '<div class="smk-bridge"><div><b>主線連動｜AI 工程師階段考核</b><br><span class="muted">' + who + '你剛轉職為人工智慧工程師。請以「職涯模式」（或教學模式）完成九大關卡；結局 A、B、D 即通過考核，晉升「智慧製造系統工程師」所需的認證。結局 C、E 可重新挑戰。自由挑戰與事故演練僅供練習，不列入考核。</span></div><button class="btn sm ghost" data-act="smkBack">返回主線</button></div>' + _vs();
  };
  var _ve = viewEnding;
  viewEnding = function () {
    var k = S.ending.k, pass = PASS.indexOf(k) >= 0, career = S.mode === 'career';
    var msg = !career ? '此為練習模式，結果不列入主線考核。' : pass ? '✅ 結局 ' + k + '：通過 AI 工程師階段考核。結果已回傳主線，返回後按「提交考核結果」。' : '❌ 結局 ' + k + '：未通過考核。檢討後可在主選單重新開始職涯模式再挑戰。';
    return '<div class="smk-bridge ' + (career ? (pass ? 'ok' : 'bad') : '') + '"><div><b>主線考核</b><br><span>' + msg + '</span></div><div class="grp">' + (career ? '<button class="btn sm" data-act="smkSend">再次回傳結果</button>' : '') + '<button class="btn sm pri" data-act="smkBack">返回主線</button></div></div>' + _ve();
  };
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || d.type !== 'smk-init') return;
    INIT = d; if (d.diff && DIFF[d.diff] && !store.get(KEYS.prefs)) UI.start.diff = d.diff;

  });
  var st = document.createElement('style');
  st.textContent = '.smk-bridge{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 0;padding:12px 16px;border-radius:10px;border:1px solid rgba(242,165,65,.55);background:rgba(242,165,65,.10);position:relative;z-index:2}.smk-bridge.ok{border-color:rgba(70,208,138,.6);background:rgba(70,208,138,.10)}.smk-bridge.bad{border-color:rgba(255,98,98,.6);background:rgba(255,98,98,.10)}.smk-bridge .grp{display:flex;gap:8px}';
  document.head.appendChild(st);

  window.parent.postMessage({ type: 'smk-survival-ready' }, '*');

</script>
